spring:
  config:
    import: optional:file:./.env[.properties]

server:
  port: ${SERVER_PORT:19092}

  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:limito-db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/


security:
  master-key: ${SECURITY_MASTER_KEY}
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY}
    access-token-expire-minutes: 30