server:
  port: 19092

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        show-sql: true
        format-sql: true
        use_sql_comments: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/